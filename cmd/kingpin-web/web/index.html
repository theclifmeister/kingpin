<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kingpin</title>
    <link rel="stylesheet" href="style.css" />
    <script src="wasm_exec.js"></script>
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <header>
      <strong class="brand">KINGPIN</strong>
      <span id="day">day –</span>
      <span id="tier"></span>
      <span>dirty <b id="dirty">–</b></span>
      <span>clean <b id="clean">–</b></span>
      <span>worth <b id="net">–</b></span>
      <span>evidence <b id="evidence">–</b></span>
      <span class="spacer"></span>
      <span class="dim" id="seed"></span>
      <button id="save" title="Keep the run in this browser">Save</button>
      <button id="load" title="The run kept in this browser">Load</button>
      <button id="new">New run</button>
    </header>
    <main>
      <canvas id="map" aria-label="The map: your cities, corners, crew and shipments"></canvas>
      <aside id="panel">
        <section>
          <h2 id="here">–</h2>
          <table id="market">
            <thead>
              <tr><th>product</th><th>street</th><th>connect</th><th>held</th><th></th></tr>
            </thead>
            <tbody></tbody>
          </table>
          <div class="dial">
            <button id="restock" title="Buy what the corners here sell in that many days, after a look at the plan">Restock</button>
            for <input id="restock-days" type="number" min="1" value="2" /> days of demand
          </div>
          <label class="dial">sell at
            <select id="dial">
              <option value="quiet">quiet</option>
              <option value="normal">normal</option>
              <option value="aggressive" selected>aggressive</option>
            </select>
          </label>
        </section>
        <section>
          <h2>Travel</h2>
          <div id="travel"></div>
        </section>
        <section>
          <h2>Looking for work</h2>
          <table id="pool">
            <thead>
              <tr><th>name</th><th>role</th><th>skill</th><th>wage</th><th>fee</th><th></th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </section>
        <section>
          <h2>This morning</h2>
          <div id="report"></div>
        </section>
      </aside>
    </main>
    <footer>
      <button id="end" class="primary">End day <kbd>space</kbd></button>
      <button id="week">Next 7 days</button>
      <button id="auto">Autopilot <kbd>a</kbd></button>
      <span id="toast" role="status"></span>
    </footer>

    <div id="card" class="overlay" hidden>
      <div class="box">
        <h2 id="card-title"></h2>
        <p id="card-text"></p>
        <div id="card-choices"></div>
      </div>
    </div>
    <div id="ending" class="overlay" hidden>
      <div class="box">
        <h2>The run is over</h2>
        <p id="ending-text"></p>
        <button id="again" class="primary">New run</button>
      </div>
    </div>
    <div id="fatal" class="overlay" hidden>
      <div class="box"><h2>Kingpin cannot start</h2><p id="fatal-text"></p></div>
    </div>
  </body>
</html>
