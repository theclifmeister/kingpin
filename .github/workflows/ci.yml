name: CI

# Runs on pull requests only: main changes solely through merged PRs whose
# checks already passed, so a second run there would be redundant. A push
# to main runs cache.yml instead, which repeats the same lint and tests
# only to save a warm cache under main; a PR restores it (#213) and never
# saves one of its own (nothing could read it: a cache saved under a PR's
# ref is visible to that PR alone). The steps both workflows run live in
# one composite action, .github/actions/go (#276), so the flags that key
# the cache cannot drift between them.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # gofmt, go mod tidy drift, go vet, staticcheck and govulncheck, the
    # last two pinned in go.mod's tool block (#276), on go.mod's Go.
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/go
        with:
          job: lint

  test:
    # Builds and tests with the toolchain declared in go.mod so the
    # minimum supported Go version is what actually gets verified.
    name: Test
    runs-on: ubuntu-latest
    env:
      # Keeps go from running git status, whose index rewrite would move
      # .git after the action's content mtimes step (#213).
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@v7

      # content mtimes, setup-go, the restore, go build and the two go
      # test lines (#211's split): the steps cache.yml runs.
      - uses: ./.github/actions/go
        with:
          job: test

      - name: balance smoke
        run: go run ./cmd/balance -runs 3 -days 50
