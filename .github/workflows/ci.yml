name: CI

# Runs on pull requests only: main changes solely through merged PRs whose
# checks already passed, so a second run there would be redundant.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Runs on the latest stable Go so staticcheck@latest is always usable;
    # analysing a module that declares an older go directive is fine.
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "files need gofmt:"; echo "$out"; exit 1
          fi

      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          "$(go env GOPATH)/bin/staticcheck" ./...

  test:
    # Builds and tests with the toolchain declared in go.mod so the
    # minimum supported Go version is what actually gets verified.
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: go build ./...

      - name: test
        run: go test -race -count=1 ./...

      - name: balance smoke
        run: go run ./cmd/balance -runs 3 -days 50
