name: Cache

# Warms the cache a pull request restores (#213). CI runs on pull requests
# only, and a cache saved during a PR's run is visible to that PR alone, so
# with setup-go's own cache every PR built and compiled cold (11 s of
# go build, ~18 s to compile the harness test binary) and then saved two
# ~90 MB entries nobody read. This workflow runs on every push to main
# (and by hand), repeats ci.yml's lint and tests through the same
# composite action, .github/actions/go (#276: one copy of the steps, so
# the test flags, which are part of Go's key, cannot drift), and saves
# GOCACHE and GOMODCACHE under a key that ends in the commit; ci.yml
# restores the newest entry for the same go.sum by prefix. Go's test
# cache rides in GOCACHE, so a PR whose change reaches none of a
# package's inputs reports that package's pass as (cached). It gates
# nothing: a red run here is a failure on main to look at, never a
# check. The entry is saved on failure too (the build cache is still
# good; Go never caches a failed test), never on a cancel.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # ci.yml's Lint job, then the save: what it compiles (vet, the pinned
    # staticcheck and govulncheck) and staticcheck's facts.
    name: Lint cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/go
        with:
          job: lint
          save: "true"

  test:
    # ci.yml's Test job, flag for flag, then the save.
    name: Test cache
    runs-on: ubuntu-latest
    env:
      # As in ci.yml: keeps go from running git status after the content
      # mtimes step (#213).
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/go
        with:
          job: test
          save: "true"
