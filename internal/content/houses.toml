# Stash houses (#73): where you keep it, and which one the raid finds. A
# house is a place in a city, on a block, with a capacity, a price in
# dirty cash and a rent in clean cash. Everything that arrives in a city
# (a buy, a contract's morning lot, a shipment landing, the road's lots)
# goes into the emptiest house there with room, else onto the street;
# everything that leaves (a sale, a shipment, a handoff) comes off the
# street first, then the houses in the order bought. A raid hits one
# place, not the operation: a house the police know about (Known: an
# informant, a robbery, a bust there), else one house or the street by
# the heat of its block. Move is free within a city but the units moved
# are exposure for the day.

[houses]
house_risk = 0.25  # multiplier on city.toml's robbery_chance x the block's risk, per house per day (a house is behind a door; a corner is on the street); a guard cuts it as an enforcer cuts a corner's
rent_days = 5      # days the rent can go unpaid before the landlord throws you out, the stock with you
move_heat = 0.3    # heat a unit moved between places draws, relative to one sold on a standard corner (heat.toml sale_heat / street_units)

# The offers, priced against the block: the quiet block, low heat and
# low risk, is dear; the one on Precinct Row is cheap because the police
# walk past it every day (heat 1.6: the raid finds it) and the robbers do
# not (risk 0.4). capacity is units; price is dirty cash, once; rent is
# clean cash a day; unlock_cash gates the offer on peak cash like a
# product or a front.

[[house]]
id = "precinct_room"
name = "Rooms over Precinct Row"
city = "eastside"
corner = "precinct"
capacity = 400
price = 12000
rent = 60
unlock_cash = 15000

