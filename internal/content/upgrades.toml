# The tier-3 and tier-4 Security nodes (#60) are how an operation outgrows
# the street's notice: they cut what a runner's unit draws, not what yours
# does, so a crew of ghosts moves ten times the tier-2 volume under the
# same sting line while you, on your own corner at the aggressive dial,
# are as hot as ever (the always-aggressive trader is indicted just as
# fast with the whole branch: heat.toml's ladder is a rate the tier can
# afford, not a wall a purchase removes).

[[upgrade]]
id = "ghosts"
name = "Ghost crew"
branch = "security"
cost = 250000
requires = ["lookouts"]
desc = "Your people are nobody. Nobody sees nobody."
[upgrade.effects]
crew_heat_mul = 0.4

[[upgrade]]
id = "cutouts"
name = "Cut-outs"
branch = "security"
cost = 1500000
requires = ["ghosts", "safehouse"]
desc = "Three people between every corner and you. None of them know your name."
[upgrade.effects]
crew_heat_mul = 0.4

[[upgrade]]
id = "drops"
name = "Dead drops"
branch = "security"
cost = 400000
requires = ["ghosts"]
desc = "The product is never on anybody. A sting finds a bin."
[upgrade.effects]
sting_stock_mul = 0.6

