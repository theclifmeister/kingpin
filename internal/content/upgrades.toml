requires = ["network"]
desc = "The same faces every day, and they bring friends."
[upgrade.effects]
demand_mul = 1.1

[[upgrade]]
id = "brand"
name = "A name on the street"
branch = "operations"
cost = 80000
requires = ["regulars"]
desc = "Your stamp on the bag. People ask for it by name."
[upgrade.effects]
demand_mul = 1.15

[[upgrade]]
id = "pricerunner"
name = "Price runner"
branch = "operations"
cost = 30000
requires = ["supplier"]
desc = "A kid who walks the corners and knows what every one is paying."
[upgrade.effects]
