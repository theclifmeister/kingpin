# The upgrade tree: persistent, stacking bonuses bought with cash. Costs are
# dirty cash unless clean = true. Each node's effects are named multipliers
# and deltas that the sims read (game.Effects folds the owned nodes at the
# top of the owning sim's step; no sim reads another's); how two nodes
# with the same effect combine is fixed per name, one of four rules:
# product (the multipliers stack), sum (the deltas add), lowest (the best
# discount owned counts, a multiplier over 1 is ignored) or highest (the
# biggest replacement or raise owned counts). The vocabulary (#117) is
# every name below, by the sim that reads it; a name not here is refused
# at start-up.
#
# Applied on purchase (game.World.BuyUpgrade):
#   carry_bonus              units added to your carry limit (sum)
#
# The market sim (market.Sim):
#   supplier_mul             on the supplier's price (lowest)
#   buy_pressure_mul         on how much a buy pushes the supplier price (product)
#   fill_mul                 on the fill of every dial (product)
#   sale_impact_mul          on the price impact of a sale (product)
#   demand_mul               on what your worked corners serve: market.Sim.Demand, which an order is served against (product)
#   glut_decay_mul           on how fast a glut clears, never over all of it (highest)
#   buyer_gap_mul            on the buyers' min_gap and max_gap between offers (lowest)
#   contract_premium_bonus   added to every contract's premium when it is offered (sum)
#
# The heat sim (heat.Sim):
#   sale_heat_mul            on the heat a sale draws (product)
#   crew_heat_mul            on the heat a unit a runner moves draws, relative to one you move (product)
#   patrol_cap               fraction of demand a patrol still lets you sell (highest)
#   cooldown_bonus           days added to the gap before the same response can fire again (sum)
#   sting_stock_mul          on the stock a sting takes (product)
#   raid_loss_mul            on the stock and cash a raid takes (product)
#   lie_low_multiplier       replaces heat.toml's lie-low decay multiplier (highest)
#   decay                    replaces heat.toml's base heat decay (highest)
#   dirty_cash_threshold_mul on the dirty cash the police read nothing into, before what the fronts cover (highest)
#   evidence_cut             evidence knocked off every sting and raid, to a floor of 0 (sum)
#   audit_evidence_cut       evidence knocked off a greedy front's audit, to a floor of 0 (sum)
#   evidence_decay_days      a point of evidence goes cold after this many days without a new one (lowest)
#   evidence_arrest          replaces heat.toml's evidence_arrest (highest)
#   fall_guys                indictments (or arrests) somebody else takes, one each, once per run (sum)
#
# The crew sim (crew.Sim, #118):
#   wage_mul                 on the wage bill (lowest)
#   loyalty_loss_mul         on the daily loyalty loss: greed drift, danger, unpaid (product)
#   danger_loyalty_mul       on what a robbery or a strike costs in loyalty (product)
#   skim_chance_mul          on the chance a member under the line skims (product)
#   informant_chance_mul     on the chance a member under the line turns (product)
#   crew_slots               added to the roster's size, crew.Sim.MaxCrew (sum)
#   candidates_bonus         added to the hiring pool (sum)
#   pool_days_cut            days off the pool's rotation, never under 1 (sum)
#   skill_bonus              added to a generated candidate's skill (sum)
#   hire_fee_mul             on a candidate's signing fee (lowest)
#   start_loyalty_bonus      added to a generated candidate's loyalty (sum)
#
# The laundering sim (laundering.Sim, #118):
#   wash_mul                 on every front's throughput (product)
#   audit_risk_mul           on every front's audit risk (product)
#   audit_seize_mul          on what an audit seizes (lowest)
#   upkeep_mul               on every front's upkeep (lowest)
#   audit_freeze_cut         days off an audit's freeze, never under 1 (sum)
#   float_mul                on the float the wash, the road and a supply contract leave in the till (lowest)
#
# The logistics sim (logistics.Sim, #119):
#   route_risk_mul           on every route's risk of interception (product)
#   route_capacity_mul       on every route's capacity per shipment (product)
#   route_days_mul           on every route's days in transit, never under one day (lowest)
#   fare_mul                 on every route's fare per unit (lowest)
#   wholesale_mul            on [wholesale] mul, the wholesaler's price over street supply (lowest)
#
# The street: the territory and rivals sims (#119):
#   drift_days_bonus         days added before a held corner nobody works drifts (sum)
#   robbery_mul              on every corner's robbery chance, before an enforcer's cut (product)
#   guard_bonus              an extra body on every contested corner in rivals.Sim.Guard (sum)
#   rival_push_mul           on the rival's push chance, rivals.Sim.PushPace (product)
#
# Pricing follows the money curve (#24): tier 1 under $50k, tier 2 to
# $500k, tier 3 to $2M, tier 4 above. Operations and Security open as
# tier-1 and tier-2 purchases, affordable in the first weeks of a managed
# run, and each branch runs up the tiers; the Legal nodes past the lawyer
# are tier-3 and tier-4 commitments, and the clean-cash nodes want what
# only the fronts produce (laundering.toml): wash first, then lawyer up.
# No node adds sale_heat_mul, crew_heat_mul or street_units beyond the
# ones below (#60's rule, TestSecurityBranchSoftensAggressive): heat
# scales with the operation, never with the lone trader.

# Operations: earn more.

[[upgrade]]
id = "stash"
name = "Stash spot"
branch = "operations"
cost = 5000
desc = "A place to keep product that is not your pockets."
[upgrade.effects]
carry_bonus = 50

[[upgrade]]
id = "stash2"
name = "Second stash"
branch = "operations"
cost = 15000
requires = ["stash"]
desc = "Two places. Nobody knows about the second one."
[upgrade.effects]
carry_bonus = 100

[[upgrade]]
id = "supplier"
name = "Supplier contact"
branch = "operations"
cost = 10000
desc = "You deal with somebody who deals with somebody."
[upgrade.effects]
supplier_mul = 0.92
buy_pressure_mul = 0.7

[[upgrade]]
id = "supplier2"
name = "Wholesale terms"
branch = "operations"
cost = 40000
requires = ["supplier"]
desc = "Volume pricing. Replaces the contact's discount."
[upgrade.effects]
supplier_mul = 0.85

[[upgrade]]
id = "network"
name = "Street network"
branch = "operations"
