# Heat tuning. Heat is 0..100; 100 means you are in a cell.

[heat]
decay = 0.10                # fraction of heat that fades per day
lie_low_multiplier = 2.2    # decay multiplier on a lie-low day
sale_heat = 7.0             # heat for moving street_units heat-weighted units at the normal dial
street_units = 100          # units a day the street absorbs before it really notices
dirty_cash_threshold = 100000 # holding more dirty cash than this attracts heat
dirty_cash_heat = 0.5       # heat per threshold multiple above it, per day
dirty_cash_cover = 10.0     # a front covers this many times its price of the pile on top of the threshold:
                            # cash with a story draws nothing (#60: the wash ladder tops out near $400k a day
                            # and a tier-4 operation makes more, so the pile it carries is what its fronts
                            # explain; a rich hider with no fronts is covered for nothing)
cooldown_days = 3           # a response level cannot fire twice within this
evidence_arrest = 6         # stings and raids build a case; at this much, indictment
                            # (only on a day you tried to sell: a sting or raid that finds
                            # you not dealing costs stock and cash but adds no evidence, so
                            # dirty cash draws attention without being a countdown;
                            # the Legal branch of upgrades.toml thins the file, lets it go
                            # cold, and raises this)
crew_heat = 0.2             # heat a unit a runner moves on their corner draws, relative to one you move yourself
informant_days = 5          # an informant on the payroll (crew.toml [informant]) feeds the DA a page every this many days,
informant_evidence = 1      # this many pages, whatever you sold and whatever your lawyer says: a witness is not a bust;
informant_heat = 3          # and this much heat the report cannot explain. While one is on the payroll a raid takes the whole stash.
tip_evidence = 0.2          # chance a tip you give the police on a rival corner (#70) puts a page in the DA's file
                            # anyway: talking to police is talking to police, and #27 bends only because you did something
sloppy_skill = 40           # runners below this skill are sloppy
sloppy_heat = 0.03          # heat per unit sold through a fully sloppy (skill 0) runner's corner
audit_heat = 6.0            # heat an audited front adds the morning after
audit_evidence = 1          # evidence an audit adds when the front was being run greedy; run normal
                            # or careful it is city heat only (#27: a case is built from what you do)
structure_evidence = 1      # pages per lot of clean cash moved offshore over laundering.toml [offshore] lot in
                            # a day (#195): structuring is something you did; a quiet day moves nothing and files nothing
taskforce_cash = 25000000   # the task force (#48) forms only with an asset owned or dirty cash over this: a tier-3
                            # player never meets it, and the pile a tier-4 operation sits on past what its fronts
                            # cover is where it bites (#191)
bust_days = 30              # a bust that took product stays on the record this long: the connect in that city holds
                            # it against you (suppliers.toml, #72), a month like the seizures
fall_heat = 50              # the fall guy (#49, upgrades.toml fall_guys): the case closes on him, the file is wiped
                            # and every city's heat drops to this ...
fall_cash = 0.5             # ... and this share of the dirty cash and of the clean goes on making it stick

[[response]]
level = "patrol"
threshold = 40
cap_days = 2
cap = 0.6

[[response]]
level = "sting"
threshold = 55
stock_loss = 0.10
cash_loss = 0.05
heat_drop = 4
evidence = 1

[[response]]
level = "raid"
threshold = 75
stock_loss = 0.50
cash_loss = 0.30
heat_drop = 25
evidence = 2

# The task force (#48): federal attention, between the raid and the
# arrest. It fires only with an asset owned or dirty cash over
# taskforce_cash (the rung is skipped otherwise, so every run without
# either plays the four-rung ladder it always did), is announced the
# morning before (TaskForceFormed: lie low, and the night it comes files
# nothing, #27), seizes one owned asset (AssetSeized: gone, not frozen),
# takes stock and cash as a raid does, and waits cooldown_days of its
# own, flat, before it can form again: no chief shortens it.
[[response]]
level = "taskforce"
threshold = 88
stock_loss = 0.50
cash_loss = 0.30
heat_drop = 30
evidence = 2
cooldown_days = 30

[[response]]
level = "arrest"
threshold = 95
