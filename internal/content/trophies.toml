# Trophies (#392): what the cartel buys to be seen buying it. The lanes
# abroad (#391, exports.toml) put the money in the billions; a trophy
# is where it shows. Clean cash only, bought on the ledger (World.
# BuyTrophy); nothing a sim needs, so a run that never buys one is the
# run before the file. While it is yours it counts in net worth at cost
# and it talks: `fear`, `respect` and `notoriety` are added to each axis
# every day it is owned (the reputation sim, which fades every axis
# toward its baseline, so a trophy holds the street's opinion up rather
# than pinning it). The task force takes the costliest thing you own
# when it comes, a trophy as readily as an asset (heat.Sim.seize).
#
# Each [[trophy]]:
#   id, name      the trophy; name is what the ledger and the paper say
#   blurb         one line for the ledger's pane
#   unlock_cash   peak clean cash that puts it on offer
#   cost          clean cash
#   fear, respect, notoriety   added to each axis a day while owned

[[trophy]]
id = "penthouse"
name = "The Penthouse"
blurb = "Three floors over the river, paid in full, and a doorman who forgets faces."
unlock_cash = 5000000
cost = 10000000
fear = 0
respect = 0.15
notoriety = 0.05

