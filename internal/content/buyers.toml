# Buyers (#71): named people in each city who want product off-corner,
# on a deadline, at a premium. The market sim deals them the way the news
# sim deals dilemma cards: none for min_gap days after the last offer,
# then a rising chance until one is certain at max_gap, one offer on the
# table at a time, off its own side stream (Tick.Sub("buyers")) so the
# deck never moves the home city's dice. An offer is answered on the
# market screen (2); the stock is handed over out of that city's stash,
# and only if you are standing there.
#
# Every price in this file is a multiplier of the street price in the
# buyer's city ON THE DAY OF DELIVERY: a contract is a bet on where the
# street will be, not a fixed figure. Sizes are in days of the demand the
# corners you work in that city serve for the product (never less than
# one standard corner's): buyers come to the operation they have heard
# of, so the same buyer asks for a bag of weed or a handful of coke, and
# for more of either once you hold the block.
#
# Each [[buyer]]:
#   id, name        the buyer; name is what the offer and the report say
#   pitch           what they say (slots: Name, Units, Product, City, Days, Premium)
#   city            city id, or "any" (drawn per offer)
#   product         product id, or "any" listed product (min_price narrows it
#                   to the tier whose home base price is at least that)
#   size            [lo, hi] days of your corners' demand there (at least a standard corner's)
#   days            [lo, hi] days to deliver, counted from the offer
#   premium         [lo, hi] multiplier on that city's street price at delivery
#   penalty         respect lost if the contract is short at the due day
#   penalty_cash    of the undelivered units' street value, taken in cash
#   heat            heat per unit handed over, relative to a unit a nobody
#                   moves on a standard corner: no corner discounts it and no
#                   dial quietens it, so it sits well above what a runner's
#                   unit draws (heat.toml crew_heat) and under your own
#   weight          relative draw weight; 0 means 1
#   once            at most once per run
#   unlock_cash     peak cash before the buyer comes looking, like products
#   [buyer.trigger] optional, the shape of a dilemma card's (content.CardTrigger)
# A key nobody reads fails at start-up.

[buyers]
min_gap = 3              # days after the last offer before the next can come
max_gap = 7              # by which the next is certain, if anyone is eligible
offer_days = 3           # days an offer stands before it lapses (never past its due day)
blacklist_days = 30      # a buyer you let down stays away this long
respect = 3              # respect a contract delivered in full earns
notoriety_penalty = 5    # notoriety a failed contract adds: word gets round
keep_days = 14           # resolved contracts stay on the books this long

