# Crew tuning. Stats are 0..100. Loyalty drifts every day; below the skim
# threshold a member steals, at the quit threshold they walk.

[crew]
max_crew = 6
candidates = 3              # people looking for work at any time
pool_days = 5               # the pool rotates every this many days
units_per_skill = 2.0       # units a runner can hold and move per skill point; a skill-50 runner carries what you do
hire_fee_base = 100         # signing fee = base + per_skill * skill
hire_fee_per_skill = 4
start_loyalty_min = 45
start_loyalty_max = 70
greed_drift = 0.8           # loyalty lost per day at greed 100 (scales linearly)
danger_days = 5             # a sting or raid counts as danger for this many days
danger_loyalty = 3.0        # loyalty lost per danger day at nerve 0 (scales with 100-nerve)
fire_loyalty = 8            # loyalty the rest lose per member fired
unpaid_loyalty = 6          # loyalty lost per day wages come up short
skim_threshold = 30         # below this loyalty a member may skim
skim_chance = 0.6           # per skimmer per day, before enforcer deterrence
skim_share = 0.10           # of the day's takings per skimmer, times 0.5 + greed/100
skim_cap = 0.5              # most of the takings that can go missing in a day
suspect_days = 10           # the crew screen warns for this long after a skim
quit_threshold = 10         # at this loyalty a member walks, or defects to the rival if it holds corners

# Snitching. A member under both lines rolls every day to start talking to
# the police; from then on they feed the DA's file whatever you sell (the
# cadence and the pages are in heat.toml) and a raid goes straight to the
# stash. Only firing them stops it. Investigating names them with a chance
# that scales with the best enforcer's skill and climbs with every try
# that came up empty; paying somebody off buys loyalty, not silence.
[informant]
loyalty = 20                # under this loyalty ...
nerve = 40                  # ... and this nerve, a member may turn
chance = 0.15               # per such member per day
investigate_cost = 2500     # dirty cash, then clean
investigate_base = 0.15     # chance an investigation names the informant with no enforcer on the payroll
investigate_skill = 0.7     # added at enforcer skill 100; scales linearly by the best enforcer's skill
investigate_learn = 0.2     # added per investigation that named nobody since the last that did
investigate_loyalty = 2     # loyalty everyone loses when an investigation names nobody
payoff_wages = 60           # a pay-off costs this many days of the member's fair wage
payoff_loyalty = 25         # and buys this much loyalty

# Lieutenants run a city for you (Phase 3.3): assigned to one, every night
# they post the idle runners on its best corners, give up on a corner
# after its second stick-up or when nobody is left to work it, and sell
# everything in its stash at the dial their temperament favours; your own
# order for a product there wins the day. They keep a cut of the city's
# takings ([role.lieutenant]) and bring their own people: an assigned
# lieutenant adds crew roster slots to max_crew. The temperament is
# drawn when they are generated and hidden until they have run a city
# for reveal_days. Under flip loyalty they turn informant with no dice
# (they know where everything is; the DA gets evidence pages a leak
# instead of heat.toml's informant_evidence), and at quit_threshold they
# walk with the city: every corner they ran goes back to the street, or
# to the rival if it holds ground there, and the stash there goes too.
# Candidates only come looking once you hold corners in two cities.
[lieutenant]
chance = 0.3                # chance a candidate is a lieutenant, once you hold corners in two cities
flip = 30                   # under this loyalty a lieutenant turns informant, no dice
evidence = 2                # pages a flipped lieutenant feeds the DA per leak (informant_days apart)
reveal_days = 10            # days on the job before the report names their temperament

# What each temperament does with the city: the sell dial it favours, a
# multiplier on the city's sale heat, what it skims on top of the cut at
# any loyalty, and whether it bothers posting enforcers on its corners.
[lieutenant.personality.violent]
dial = "aggressive"
heat = 1.25
skim = 0
guard = true

[lieutenant.personality.greedy]
dial = "normal"
heat = 1.0
skim = 0.08
guard = false

[lieutenant.personality.careful]
dial = "quiet"
heat = 0.8
skim = 0
guard = true

[lieutenant.personality.steady]
dial = "normal"
heat = 1.0
skim = 0
guard = true

# The pay dial: wage is a multiplier on each member's fair wage, loyalty the
# daily drift it buys.
[pay.stingy]
wage = 0.6
loyalty = -1.2

[pay.fair]
wage = 1.0
loyalty = 0.4

[pay.generous]
wage = 1.5
loyalty = 1.2

# Fair wage = wage_base + wage_per_skill * skill.
[role.runner]
wage_base = 20
wage_per_skill = 0.6

[role.enforcer]
wage_base = 30
wage_per_skill = 0.5
protection = 0.5            # each enforcer halves what danger costs the crew's loyalty
deterrence = 0.5            # each enforcer halves the chance a skimmer dares

[role.accountant]
wage_base = 60
wage_per_skill = 1.2
# Accountants only show up looking for work once you own a front. What they
# add to every front, and cut from its audit risk, is in laundering.toml.

[role.lieutenant]
wage_base = 80
wage_per_skill = 1.5
cut = 0.08                  # share of their city's takings they keep, every day
crew = 4                    # roster slots an assigned lieutenant adds: their own people
