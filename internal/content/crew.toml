# Crew tuning. Stats are 0..100. Loyalty drifts every day; below the skim
# threshold a member steals, at the quit threshold they walk.

[crew]
max_crew = 6
candidates = 3              # people looking for work at any time
pool_days = 5               # the pool rotates every this many days
units_per_skill = 2.0       # units a runner can hold and move per skill point; a skill-50 runner carries what you do
hire_fee_base = 100         # signing fee = base + per_skill * skill
hire_fee_per_skill = 4
start_loyalty_min = 45
start_loyalty_max = 70
skill_min = 15              # a candidate's skill is drawn evenly in skill_min..skill_max, before the tree's
skill_max = 85              # skill_bonus: nobody walks in useless and nobody walks in finished
greed_min = 5               # greed and nerve are drawn the same way, wider: a saint and a coward are rare,
greed_max = 95              # never impossible
nerve_min = 5
nerve_max = 95
greed_drift = 0.8           # loyalty lost per day at greed 100 (scales linearly)
danger_days = 5             # a sting or raid counts as danger for this many days
danger_loyalty = 3.0        # loyalty lost per danger day at nerve 0 (scales with 100-nerve)
fire_loyalty = 8            # loyalty the rest lose per member fired
unpaid_loyalty = 6          # loyalty lost per day wages come up short
skim_threshold = 30         # below this loyalty a member may skim
skim_chance = 0.6           # per skimmer per day, before enforcer deterrence
skim_share = 0.10           # of the day's takings per skimmer, times 0.5 + greed/100
skim_cap = 0.5              # most of the takings that can go missing in a day
suspect_days = 10           # the crew screen warns for this long after a skim
quit_threshold = 10         # at this loyalty a member walks, or defects to the rival if it holds corners
alert_margin = 5            # this close over the next line (skim, walk, a lieutenant's flip) a member is an alert (#345),
                            # and so is one tonight's drift takes over it; 0 never

# Snitching. A member under both lines rolls every day to start talking to
# the police; from then on they feed the DA's file whatever you sell (the
# cadence and the pages are in heat.toml) and a raid goes straight to the
# stash. Only firing them stops it. Investigating names them with a chance
# that scales with the best enforcer's skill and climbs with every try
# that came up empty; paying somebody off buys loyalty, not silence.
[informant]
loyalty = 20                # under this loyalty ...
nerve = 40                  # ... and this nerve, a member may turn
chance = 0.15               # per such member per day
investigate_cost = 2500     # dirty cash, then clean
investigate_base = 0.15     # chance an investigation names the informant with no enforcer on the payroll
investigate_skill = 0.7     # added at enforcer skill 100; scales linearly by the best enforcer's skill
investigate_learn = 0.2     # added per investigation that named nobody since the last that did
investigate_loyalty = 2     # loyalty everyone loses when an investigation names nobody
payoff_wages = 60           # a pay-off costs this many days of the member's fair wage
payoff_loyalty = 25         # and buys this much loyalty

# Lieutenants run a city for you (Phase 3.3): assigned to one, every night
# they post the idle runners on its best corners, give up on a corner
# after its robbed_off-th stick-up or when nobody is left to work it, and sell
# everything in its stash at the dial their temperament favours; your own
# order for a product there wins the day. They keep a cut of the city's
# takings ([role.lieutenant]) and bring their own people: an assigned
# lieutenant adds crew roster slots to max_crew. The temperament is
# drawn when they are generated and hidden until they have run a city
# for reveal_days. Under flip loyalty they turn informant with no dice
# (they know where everything is; the DA gets evidence pages a leak
# instead of heat.toml's informant_evidence), and at quit_threshold they
# walk with the city: every corner they ran goes back to the street, or
# to the rival if it holds ground there, and the stash there goes too.
# Candidates only come looking once you hold corners in two cities.
[lieutenant]
chance = 0.3                # chance a candidate is a lieutenant, once you hold corners in two cities
flip = 30                   # under this loyalty a lieutenant turns informant, no dice
evidence = 2                # pages a flipped lieutenant feeds the DA per leak (informant_days apart)
reveal_days = 10            # days on the job before the report names their temperament
betray_share = 0.5          # a lieutenant who flips running a city that holds this share of your corners ends the run betrayed (#49); 0 never
betray_corners = 3          # ... and at least this many corners there: a flip over one corner is a leak, not a betrayal (the boss's seed 6 collapsed to one)
robbed_off = 2              # a corner stuck up this many times is not worth the stock: they take the crew off it and
                            # never post a runner or an enforcer there again

# What each temperament does with the city: the sell dial it favours, a
# multiplier on the city's sale heat, what it skims on top of the cut at
# any loyalty, whether it bothers posting enforcers on its corners, and
# how many days of the demand its worked corners serve it keeps the
# stash at (#174: a supply contract per product the connects there
# sell, bought each morning at market.toml's [supply] markup where you
# have set no contract of your own; 0 buys nothing). The contract fills
# before the night's sale, and the dial sets what the night sells
# (market.toml [dial.*] fill of demand, up to x1.25 with the tree's
# fill_mul), so the stock days are read against that: the violent one
# pushes up to two days a night and keeps three, the steady one sells
# up to a day and a quarter and keeps two, the careful one moves half a
# day and keeps one, and the greedy one keeps the least that covers the
# night, a day and a half, and the money.
[lieutenant.personality.violent]
dial = "aggressive"
heat = 1.25
skim = 0
guard = true
stock_days = 3

[lieutenant.personality.greedy]
dial = "normal"
heat = 1.0
skim = 0.08
guard = false
stock_days = 1.5

[lieutenant.personality.careful]
dial = "quiet"
heat = 0.8
skim = 0
guard = true
stock_days = 1

[lieutenant.personality.steady]
dial = "normal"
heat = 1.0
skim = 0
guard = true
stock_days = 2

# The pay dial: wage is a multiplier on each member's fair wage, loyalty the
# daily drift it buys.
[pay.stingy]
wage = 0.6
loyalty = -1.2

[pay.fair]
wage = 1.0
loyalty = 0.4

[pay.generous]
wage = 1.5
loyalty = 1.2

# Fair wage = wage_base + wage_per_skill * skill.
[role.runner]
wage_base = 20
wage_per_skill = 0.6
bail = 1500                 # clean cash to walk them out of a cell tomorrow (#46)

[role.enforcer]
wage_base = 30
wage_per_skill = 0.5
bail = 2500
protection = 0.5            # each enforcer halves what danger costs the crew's loyalty
deterrence = 0.5            # each enforcer halves the chance a skimmer dares

[role.accountant]
wage_base = 60
wage_per_skill = 1.2
bail = 4000
# Accountants only show up looking for work once you own a front. What they
# add to every front, and cut from its audit risk, is in laundering.toml.

# Fixers (#42) know who takes an envelope: a skill-100 fixer adds
# law.toml's fixer_odds to a bribe's odds at the DA's office and takes
# fixer_discount off the price. They come looking for work once you have
# paid somebody (a bribe, a checkpoint or a customs agent), on their own
# side stream, so a run that pays nobody draws the pool it always did.
# A backfire costs them backfire_loyalty and, under the flip line, turns
# them the way an audit turns an accountant.
[role.fixer]
wage_base = 70
wage_per_skill = 1.3
bail = 5000
chance = 0.15               # chance a candidate is a fixer once one is wanted
backfire_loyalty = 25       # what a backfire costs the fixer's loyalty; under the informant line they turn

[role.lieutenant]
wage_base = 80
wage_per_skill = 1.5
bail = 10000
cut = 0.08                  # share of their city's takings they keep, every day
crew = 8                    # roster slots an assigned lieutenant adds: their own people

# The chemist (#47) is who makes quality. One comes looking for work
# once meth is on the ladder (the pool carries a chemist beside its
# usual faces, drawn off the chemist's own stream with a name from
# names.toml's chemists, so the faces you always drew are the faces you
# draw). Their quality is quality_base + quality_per_skill x skill: what
# a cook lands at. A cut with a chemist on the payroll keeps cut_bonus x
# the best chemist's skill points of quality the cut would have lost
# (cutting with a good chemist is nearly free). Cook(product, units)
# needs one: precursors cost market.toml's cook_cost a unit, dirty, up
# to batch_per_skill x skill units an order, one order a product a day,
# and the crew sim lands the lot cook_days later at the chemist's
# quality as it was the day it was ordered. Without a chemist nothing
# cooks and a cut is what the ratio says. The lab raid (#46): a raid
# that takes stock in a city jails the chemist by [life] arrest_chance
# like a runner on the corner.
[role.chemist]
wage_base = 70
wage_per_skill = 1.4
bail = 6000
unlock_product = "meth"     # the rung whose listing brings one looking
quality_base = 30           # a chemist's quality is this ...
quality_per_skill = 0.6     # ... plus this per skill point: 39 at skill 15, 81 at 85
cut_bonus = 0.2             # quality points a cut keeps per point of the best chemist's skill
cook_days = 3               # days from the order to the lot
batch_per_skill = 2.0       # units a cook order can be for, per skill point

# The driver (#46) rides every shipment on the route they are assigned
# to (World.SetRouteDriver, persistent like the dial) and takes
# driver_cut x skill/100 off its risk per day on the road, on top of a
# bought checkpoint's cut; a seized shipment jails them with it, no
# dice. One comes looking for work once a route has run (a face beside
# the pool's usual ones, the chemist's pattern: drawn off the driver's
# own stream with a name from names.toml's drivers, so a run that never
# ships draws the pool it always did).
[role.driver]
wage_base = 40
wage_per_skill = 0.8
bail = 2000
driver_cut = 0.5            # a skill-100 driver halves a shipment's risk per day; skill 60 takes 30% off

# Crew life (#46): kin, ageing, arrests and getting shot. Every roll
# here is off the life stream (Tick.Sub("life")), never the home
# city's, so a run with this table zeroed (harness.NoLife, cmd/balance
# -life off) is byte-for-byte the run before the feature.
#
# Kin: hiring somebody puts their cousin, partner or friend in the pool
# with kin_chance, an extra face at kin_discount off the fee; kin on
# the payroll remember what you do to each other: firing one costs the
# other kin_loyalty (an informant's firing costs nothing, as it costs
# the crew nothing), paying one off lifts the other by it, one walking
# or defecting drops it, and one shot dead on your corner costs the
# other kin_body_loyalty and gives them kin_body_nerve.
#
# Ageing: a member is age_min..age_max when generated, a year older
# every year_days on the payroll; skill grows skill_growth a day, times
# the pay dial's wage multiplier, up to skill_cap (a skill-30 runner on
# generous pay reaches the cap inside the horizon); past nerve_age each
# birthday takes nerve_loss; on the birthday at retire_age they retire:
# one loyal past retire_loyal recommends a kin (a face in the pool at
# the discount), one sour under the informant line talks on the way
# out, one informant page in the DA's file (the exception applied once).
#
# Arrests: a sting or raid that hit a city arrests each runner and
# enforcer who stood on a corner there with arrest_chance (the heat sim
# stamps who stood where; the crew sim resolves it the next morning), a
# raid that took stock jails the chemist the same way, and a seized
# shipment jails its driver with no dice. A jailed member is off the
# corner for jail_days and sells and guards nothing; Bail(id) (clean
# cash, the role's bail) frees them tomorrow with bail_loyalty; unbailed
# they come back jail_loyalty under the informant line and roll
# release_turn at once, the witness the DA made of your dealing.
#
# Shot: your enforcers going in (CornerStruck) and a rival push that
# fails against a guarded corner wound the enforcer with wound_chance
# (off the corner for wound_days) or kill them with kill_chance, both
# times the force's shot multiplier for a strike and the rival's
# personality's for a push; the rival's muscle dies the same way and
# Stats.Bodies counts both sides. Every death is a headline about you
# (reputation.toml [notoriety] body) and pressure in the city (law.toml
# [sources] body).
[life]
year_days = 30              # a crew year
age_min = 19
age_max = 44
skill_growth = 0.2          # skill a day on the payroll at fair pay (x the pay dial's wage multiplier)
skill_cap = 80
nerve_age = 38              # past this age ...
nerve_loss = 4              # ... every birthday takes this much nerve
retire_age = 50
retire_loyal = 60           # a retiree at or over this loyalty recommends a kin
arrest_chance = 0.25        # per runner or enforcer on a corner of the city the police hit
jail_days = 10
bail_loyalty = 15           # what a bail buys the one bailed
jail_loyalty = 10           # an unbailed release comes back this far under the informant line
release_turn = 0.35         # ... and turns informant at once with this chance
wound_chance = 0.15         # the guard, per strike or failed push, before the multipliers
kill_chance = 0.04
wound_days = 12
kin_chance = 0.35           # a hire's kin come looking
kin_discount = 0.5          # ... at this much off the fee
kin_loyalty = 10
kin_body_loyalty = 25
kin_body_nerve = 15

# What a strike's force and the rival's personality do to the odds of a
# wound or a death.
[life.force]
warn = 0.5
push = 1.5
hit = 2.5

[life.personality]
expansionist = 0.6
defensive = 0.4
opportunist = 0.6
chaotic = 1.0
