# Dilemma cards (#15). The news sim deals at most one a day, none for
# min_gap days after the last, then a rising chance until one is certain at
# max_gap, so they come at roughly one every 5-8 days. The card is shown
# before the morning report; the choice and its outcome go in the journal.
#
# Each [[card]] has a [card.trigger] (every set field must hold; see
# content.CardTrigger), 2-3 [[card.choice]] entries and per-choice
# [card.choice.effects] keyed by the names in game.EffectKeys:
#   dirty_cash, clean_cash     fixed deltas
#   dirty_amount, clean_amount multiples of the card's Amount
#   heat                       0..100
#   loyalty                    the member the trigger named
#   crew_loyalty               everyone on the payroll
#   war, grudge, rival_muscle, rival_cash
#   stock_share                fraction of every product, lost if negative
#   fear, respect, notoriety   reputation (#14); no-op until it lands
# A key the world does not know fails at start-up. Amount is amount_share
# of the player's dirty cash (the bag it is paid from), but at least
# amount, rounded to two figures.
#
# Slots: {{.Name}} {{.Role}} (the member), {{.Corner}} (yours), {{.Theirs}}
# (the rival corner it borders, when contested), {{.Rival}} (the leader),
# {{.City}}, {{.Front}}, {{.Product}}, {{.Amount}}.
#
# Convention: the LAST choice is what happens if you do nothing; the
# harness takes it for any card a policy does not answer. Text reads at 80
# columns: keep it under ~280 characters and outcomes under 70.

[dilemmas]
min_gap = 5
max_gap = 8

