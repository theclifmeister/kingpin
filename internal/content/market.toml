# Market tuning. Prices are per unit, demand is units per day, both for the
# home city; city.toml scales them per city.

[market]
start_cash = 500
carry_limit = 100
history_days = 30
supplier_ratio = 0.55        # supplier price as a fraction of street price
buy_price_pressure = 0.25    # supplier price rises by this * qty/demand per buy
price_floor_ratio = 0.25     # price never drops below base * this
price_ceiling_ratio = 4.0    # or above base * this
reversion = 0.18             # fraction of the gap to target closed per day
glut_decay = 0.40            # fraction of glut that clears per day
sale_impact = 0.05           # price impact of selling one day's demand at normal; grows with the square of volume/demand
shock_chance = 0.04          # per product per day
slump_chance = 0.03

[[product]]
id = "weed"
name = "Weed"
base_price = 20
volatility = 0.04
demand = 60
demand_noise = 0.20
heat = 0.6
cut_max = 1.0
cut_cost = 1

[[product]]
id = "pills"
name = "Pills"
base_price = 45
volatility = 0.06
demand = 30
demand_noise = 0.25
heat = 1.0
cut_max = 1.0
cut_cost = 2

[[product]]
id = "coke"
name = "Coke"
base_price = 120
volatility = 0.09
demand = 12
demand_noise = 0.30
heat = 1.5
cut_max = 1.0
cut_cost = 6

# The ladder. Each rung is offered by the supplier once your peak cash shows
# you can move that kind of money: bigger numbers, bigger heat per unit,
# and less heat per dollar the higher you climb, which is what climbing is
# for. Heroin and meth are on offer in the first weeks (tiers 1 and 2);
# designer is the port's product (#60): it unlocks at the wholesaler's
# line, only Bayport's supplier sells it (city.toml), and it reaches home
# by the road. Its demand is tier-3 sized because only a tier-3 player
# can reach it: a standard corner moves forty a day. Every product can be
# cut up to cut_max (1.0: doubled) at cut_cost a unit added ([quality],
# #47); meth and designer can be cooked from precursors by a chemist at
# cook_cost a unit, dirty, under what a connect asks (crew.toml
# [role.chemist] has the days and the batch).
[[product]]
id = "heroin"
name = "Heroin"
base_price = 400
volatility = 0.10
demand = 14
demand_noise = 0.35
heat = 1.8
unlock_cash = 3000
cut_max = 1.0
cut_cost = 20

[[product]]
id = "meth"
name = "Meth"
base_price = 800
volatility = 0.12
demand = 3
demand_noise = 0.40
heat = 2.2
unlock_cash = 10000
cut_max = 1.0
cut_cost = 40
cook_cost = 300

[[product]]
id = "designer"
name = "Designer"
base_price = 2500
volatility = 0.15
demand = 40
demand_noise = 0.50
heat = 2.5
unlock_cash = 500000
cut_max = 1.0
cut_cost = 120
cook_cost = 900

# Quality (#47). Every stash carries a quality, 0..100, one number per
# product per city (the street and the houses there as one lot: a buy
# blends the connect's figure in by units, a cut adds units at nothing).
# default is what the connects sell at (suppliers.toml may give a connect
# its own figure per product), what an old save's stock reads and where
# the price multiplier is 1: the multiplier runs linearly from low_mul at
# quality 0 to 1 at default, and from there to high_mul at 100, on every
# street sale and on a buyer's premium. Corners remember what you sold
# them: Repeat (repeat_start to begin with) is the share of a corner's
# demand that comes back; a day the product sold there is under
# repeat_floor it falls by repeat_loss, any other day it recovers
# repeat_gain, never under repeat_min, and the corner's served demand is
# its share times it. Hard product under od_quality overdoses: one roll
# per od_units sold in a city in a day at od_chance, off its own side
# stream; an overdose is pressure (law.toml), notoriety (reputation.toml)
# and a headline naming the corner, never evidence (#27). A cut adds
# units x ratio units, up to the product's cut_max, at cut_cost a unit
# added in dirty cash, and the quality drops by the same ratio (the pure
# weight is conserved); a chemist raises it back (crew.toml). A run that
# never cuts, cooks or hires a chemist sells at default everywhere, so
# every multiplier is 1 and no corner moves (TestNoCutIsTheOldRun).
[quality]
default = 50
low_mul = 0.7
high_mul = 1.25
repeat_start = 1.0
repeat_floor = 40
repeat_loss = 0.0075
repeat_gain = 0.005
repeat_min = 0.2
od_quality = 30
od_units = 20
od_chance = 0.15
od_products = ["heroin", "meth", "designer"]

# Supply contracts (#113): keep the stash in a city at a level, bought
# each morning from the supplier there. The markup is the supplier's price
# for a standing order over the price you would pay by hand: the routine
# costs a little, so buying by hand still has a point. The float is the
# dirty cash a contract leaves in the till (folded by the tree's float_mul
# like the wash's): zero, because a contract is the street's own restock
# and spends like a buy by hand; the laundering float is what the wash and
# the road leave *for* it.
[supply]
markup = 1.05
float = 0

# Standing orders (#114): a sell order that stands, the same units at the
# same dial every night until cancelled, resolved exactly as a fresh order
# would be. The cut is the share of the take the crew keep for working the
# night without you: the penalty is the point, the hand still pays better.
# It comes off the take, not the profit, so it weighs about two and a half
# times what it reads at the crewed player's margin: 0.05 of the take is
# an eighth of the profit, and the routine player ends day 70 at 88% of
# the hand (TestRoutineIsWithinFifteenPercentOfCrewed); 0.10 was 77%.
[standing]
cut = 0.05

# The dial: how much of demand you can move, the price you get, how hard you
# push the market, and how much heat you attract.
[dial.quiet]
fill = 0.5
price = 0.95
impact = 0.4
heat = 0.6

[dial.normal]
fill = 1.0
price = 1.0
impact = 1.0
heat = 1.0

[dial.aggressive]
fill = 1.6
price = 1.10
impact = 1.3
heat = 2.2
