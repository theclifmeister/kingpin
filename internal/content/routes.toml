# The route graph: edges between cities. Every mode is a point on the
# speed / cost / risk triangle: days in transit at the normal dial, the
# most one shipment carries, what every unit costs to send (dirty cash),
# and the chance per day in transit that the shipment is intercepted. A
# route is a dial the player sets once (#61): the logistics sim runs it
# from `from` to `to` every day, sending what `to` is short of the target
# the player set for it, one shipment per product per day, and buying the
# shortfall by the lot at `from` where the wholesaler deals.

[shipping]
seizure_heat = 15           # heat a seizure adds in both cities on the route
seizure_evidence = 1        # pages in the DA's file, only if the shipment was sent fast (#27: a case is built from what you did)
shock_factor = 1.8          # price multiplier on the product in the city the shipment was bound for ...
shock_days = 5              # ... for this many days: the street was counting on it
record_days = 30            # seizures stay on the ledger this long

# The wholesale supplier: a city marked wholesale in city.toml sells by the
# lot at a fraction of its street supplier's price, once your peak cash
# says you can move that kind of weight. The routes buy from it; you do
# not. The road spends only what is over the laundering float.
[wholesale]
lot = 100
mul = 0.7
unlock_cash = 500000

# The route dial's speeds: fast halves the days and multiplies the risk on
# each (off is the fourth position, and the zero value).
[dial.slow]
days = 1.5
risk = 0.5

[dial.normal]
days = 1.0
risk = 1.0

[dial.fast]
days = 0.5
risk = 2.5

[[route]]
id = "coast"
name = "Coast Road"
mode = "car"
from = "bayport"
to = "eastside"
days = 2
capacity = 60
cost = 8
risk = 0.02

[[route]]
id = "interstate"
name = "Interstate"
mode = "truck"
from = "bayport"
to = "eastside"
days = 3
capacity = 400
cost = 3
risk = 0.03

[[route]]
id = "channel"
name = "The Channel"
mode = "boat"
from = "bayport"
to = "eastside"
days = 5
capacity = 2000
cost = 1
risk = 0.015
