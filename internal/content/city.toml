# Bayport: the port town down the coast. Coke and heroin come off the
# boats cheap and the locals have little taste for them; weed and pills
# cost more than they do at home. The police watch the water, not the
# corners. A 3 x 2 grid.

[[city]]
id = "bayport"
name = "Bayport"
heat = 0.85
wholesale = true

[city.market]
coke = { price = 0.35, demand = 0.5 }
