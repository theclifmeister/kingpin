# The cities, block by block. Every corner is its own demand pool: a city's
# demand for a product is the sum over the corners you work there. demand is
# the corner's size relative to one standard corner (the whole tier-1 game);
# taste scales one product's share on that corner; heat multiplies the sale
# heat of units moved there; risk multiplies the chance it gets robbed.
#
# The first city is home: a run starts there and the rival sets up there.
# Each city has its own take on the product ladder ([city.market]: a price
# and demand multiplier per product; unlisted products are at 1) and its own
# police (heat, a multiplier on every sale there), so what is cheap in one
# city is worth shipping to the other (routes.toml). wholesale says the
# city's supplier sells by the lot.

[territory]
start = "fourth"            # the corner you stand on from day 0 (in the home city)
drift_days = 3              # a held corner nobody works goes back to the street after this many days
robbery_chance = 0.04       # per worked corner per day, before risk and the enforcer's cut
robbery_stock = 0.50        # of the stock that corner's share of the operation was carrying
robbery_cash = 0.50         # of the day's takings on that corner
enforcer_cut = 0.80         # fraction of the robbery chance a skill-100 enforcer removes; half that at skill 0

[[city]]
id = "eastside"
name = "Eastside"
heat = 1.0

# Designer is the port's product (#60): nobody in Eastside sells it to
# you, so it reaches home by the road (routes.toml) or in your pockets.
[city.market]
designer = { no_supply = true }

