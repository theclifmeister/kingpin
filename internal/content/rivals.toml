# The rival faction: one per run, picked by seed. It earns off the corners
# it holds, spends on muscle and claims, pushes on the corners of yours it
# borders, undercuts you there, and calls the cops when you hurt it.

[rivals]
arrive_day = 10             # it moves in on the first day from this one with a free corner
start_cash = 6000
start_muscle = 2
margin = 0.30               # of the street value its corners move, as daily income
muscle_wage = 120           # per muscle per day; unpaid muscle walks
muscle_fee = 1500           # to recruit one
claim_cost = 2500           # to set up on a free corner
supplier_min = 0.75         # its supplier price as a fraction of street, drawn between these:
supplier_max = 0.95         # a better connect than yours (0.55 is what you pay) is what lets it undercut
push_flip = 0.4             # chance a push flips a corner at even odds; scales by attack/(attack+defence)
push_war = 8                # war heat per push
undercut_price = 0.03       # street price drag per day when every corner you work is undercut by the best connect (scales by the share that is); against reversion it settles prices ~10% lower
tip_heat = 6                # heat a tip to the police adds
observe_days = 8            # days after arrival before its personality shows; a push or a tip shows it sooner
regroup_days = 20           # days after losing its last corner before it tries again
war_decay = 0.10            # fraction of war heat that fades per day
war_threshold = 40          # past this the war is open: headlines, and the police notice
crackdown_threshold = 80    # past this the police clear the front line on both sides
crackdown_corners = 2       # corners each side loses in a crackdown, contested ones first
crackdown_heat = 12         # heat the player draws from a crackdown
crackdown_muscle = 0.5      # fraction of the rival's muscle a crackdown takes
outbid_grudge = 1           # grudge it holds when a claim it telegraphed finds somebody on the corner (#69: the tell)

# Pace (#60): how fast it takes the city. Its claim chance is scaled by
# your share of home's corners, from claim_scale_min with nothing held to
# claim_scale_max with all of it (a player with nothing gets time, one
# with eight corners gets a fight); after any claim it waits
# claim_cooldown days before it claims again, unless your enforcers have
# been in within those days (a fight is a fight: struck, it grows as
# fast as it can), and its arrival is not a claim, so the second corner
# comes as soon as it likes (the roll is still made on a cooldown day,
# so the seed's dice do not move); and for arrive_grace days after it
# arrives it never sets up on a corner you have ever worked. While it
# waits it pushes on your corners at push_past_cap, as it does once it
# holds its share: the pace is slower, never a pause. Fear slows its
# claims too (reputation.toml rival_claim_cut).
[pace]
claim_scale_min = 0.25
claim_scale_max = 1.5
claim_cooldown = 12
arrive_grace = 5

# The price war (#68): the player's third answer to a rival corner, money.
# Working a corner next to one of the rival's cheap takes a share of its
# demand: steal of the rival corner's demand at the normal dial, scaled by
# the dial's impact and by the worked share of its neighbours you hold
# (two of your corners bordering it cut deeper than one; all of them cut
# the full share), served on top of your own corners' demand by tonight's
# orders at price_cut off the street price, and with glut on those units'
# price impact, so a long price war crashes the product you fight it
# with. The rival corner's squeeze carries the share taken that day, so
# its income there falls without it knowing who did it. Each undercut day
# adds war to the war, and no public pressure: it is business, not
# violence. A corner squeezed pricewar_days days (a rest that long
# forgets them) gets an answer by personality, and, if grudge, a grudge
# held with it (so tip_chance applies; a grudge every undercut day made
# the price war hotter than a hit war): a defensive or expansionist rival
# pushes on the player corner doing the cutting at push_chance times
# pricewar_push, an opportunist abandons the corner (RivalAbandoned) and
# claims elsewhere, a chaotic one rolls between the two.
[pricewar]
steal = 0.20
price_cut = 0.10
glut = 1.4
war = 2
grudge = true
pricewar_days = 5
pricewar_push = 2.0

# Diplomacy (#32): the table. A proposal is answered the next morning with
# a chance built from the deal kind's base, the terms asked (the easy
# option adds `terms`, the hard one takes it away), accept_trust at full
# trust, the personality's deal_bias, accept_war at a full-loud war, and
# what the player's reputation adds (reputation.toml [effects]). After a
# betrayal the rival takes nothing for distrust_days and trust sits at
# betrayal_floor. Every day of a live deal earns trust_kept.
[diplomacy]
offer_days = 5              # a rival offer stays on the table this long
trust_kept = 0.6            # trust per day of a live deal (respect adds to it: reputation.toml)
accept_trust = 0.5          # added to the chance at trust 100
accept_war = 0.35           # added to the chance at war 100: a loud war makes peace attractive to both sides
betrayal_floor = 5          # trust after you break a deal
distrust_days = 30          # days after a betrayal it takes no deal and offers none
betrayal_spread = 20        # trust every other faction loses when you betray one (Phase 4 wires it)
joint_trust = 70            # trust a joint shipment needs (#30 wires it)
truce_days = [15, 30, 60]   # the three lengths a truce can be proposed at: the short one is the easy ask
tribute_cuts = [0.05, 0.10, 0.20] # the three cuts of your daily street value a tribute can be: the big one is the easy ask
tribute_min = 200           # a tribute is never under this a day
low_cash_days = 3           # an expansionist that cannot pay its muscle this many days offers a truce
upper_hand = 1.5            # an opportunist with this many times the guard on your front line demands tribute
split_fair = 0.45           # share of the city's demand it lets your side of a split have at trust 0 ...
split_trust = 0.30          # ... plus this at trust 100; a greedier line is refused outright

# What each deal kind is worth to it before trust and temper.
[deal.truce]
base = 0.20
terms = 0.15
[deal.tribute]
base = 0.35
terms = 0.20
[deal.split]
base = 0.10
terms = 0.15

# Personalities. trust is where its trust in you starts; deal_bias is
# added to the chance it accepts any proposal; betrayal is the chance per
# live deal per day it breaks one itself; offer_chance is per day its
# situation calls for a deal. claim_chance and push_chance are per day; max_share is
# the most of home's corners it sets up on, as a share of the map (0.6 of
# ten corners is six), and past it it pushes on your corners at
# push_past_cap times the chance (0: only with a grudge); grow says where
# it claims (biggest free
# corner anywhere, one next to its own, or at random); muscle_per_corner is how
# much muscle it keeps per corner held (plus one); undercut is the share of
# a contested corner's demand it steals; tip_chance is per day with a
# grudge; defence multiplies its muscle when you strike it.
[personality.expansionist]
trust = 35
deal_bias = -0.15           # it wants the city; a truce is a pause, and it offers one only when it cannot pay its muscle
betrayal = 0
offer_chance = 0.25
claim_chance = 0.25
max_share = 0.6
push_past_cap = 0.5         # it wants the city, and slows down once it has most of it
grow = "biggest"
push_chance = 0.15
muscle_per_corner = 1.0
undercut = 0.15
tip_chance = 0.30
defence = 1.0

[personality.defensive]
trust = 55
deal_bias = 0.20            # it would rather hold what it has; it offers a truce once the war is loud, and never breaks one
betrayal = 0
offer_chance = 0.30
claim_chance = 0.08
max_share = 0.3
grow = "adjacent"
push_chance = 0.03
muscle_per_corner = 2.0
undercut = 0.10
tip_chance = 0.50
defence = 1.6

[personality.opportunist]
trust = 40
deal_bias = 0
betrayal = 0
offer_chance = 0.20         # it demands tribute while it has the upper hand on the front line
claim_chance = 0.15
max_share = 0.4
grow = "biggest"
push_chance = 0.08          # doubled on a corner with no enforcer, or while your heat is over 50
muscle_per_corner = 1.0
undercut = 0.25
tip_chance = 0.60
defence = 0.9

[personality.chaotic]
trust = 45
deal_bias = 0.05
betrayal = 0.02             # per deal-day: it breaks deals for no reason
offer_chance = 0.10         # a truce now and then, on a whim
claim_chance = 0.20
max_share = 0.4
grow = "random"
push_chance = 0.15
muscle_per_corner = 1.2
undercut = 0.20
tip_chance = 0.40
defence = 1.0

# The force dial on a strike. attack multiplies your enforcers' strength;
# flip is the chance to take the corner at even odds; heat is what the
# player draws (times the corner's heat); war is what it adds to the war;
# loyalty is what an enforcer with no nerve loses over it; trust is what
# it costs the rival's trust in you (a push or a hit under a live deal is
# a betrayal on top of that; a warning is not).
[force.warn]
attack = 0.4
flip = 0.25
heat = 3
war = 5
loyalty = 1
trust = 2

[force.push]
attack = 1.0
flip = 0.6
heat = 8
war = 12
loyalty = 3
trust = 6

[force.hit]
attack = 1.8
flip = 0.9
heat = 18
war = 25
loyalty = 6
trust = 12
