# The rival factions: three to six per run, picked by seed ([factions],
# #43); the first is the rival at home. Each earns off the corners
# it holds, spends on muscle and claims, pushes on the corners of yours it
# borders, undercuts you there, and calls the cops when you hurt it.
#
# Its money is priced in the ladder's unit (#139), the corner-day: what a
# standard corner at home earns it in a day, margin of the street value
# the corner moves in the products the street there sells (the port's
# product comes by the road, which it does not run, so designer at home
# is not its trade). Its take is margin of what its corners move; its
# muscle, its hires and its claims cost corner-days, so they climb the
# ladder with the take and a price war (#68) or a drain is felt at every
# tier. It keeps the muscle its take pays for, up to muscle_per_corner
# per corner held plus one and never under the start_muscle it came with:
# a head the day's take does not cover walks, at once, so a corner
# squeezed next door is a head fewer on the front line. What the take
# leaves is its war chest, the pile that pays for a hire (muscle_fee) or
# a claim (claim_cost) while it covers both, and what a drain takes.
# Left alone it holds a chest of ten to thirty days of wages at day 120
# (territory, five seeds: 17 defensive, 24 expansionist, 27 opportunist,
# 18 chaotic) and never runs dry; muscle_wage is the dial: a corner's
# guard at 0.9 of a corner's take leaves a defensive rival on three
# corners a tenth over its wages a day and an expansionist on eight a
# third, and the chest it arrives with carries the two heads its first
# corner does not pay for until the second.

[rivals]
arrive_day = 10             # it moves in on the first day from this one with a free corner
start_cash = 80             # corner-days in hand when it arrives
start_muscle = 2            # heads it arrives with, and never lets go
margin = 0.30               # of the street value its corners move, as daily income
muscle_wage = 0.9           # what a corner's guard (muscle_per_corner heads) costs it a day, in corner-days; a head earns that over muscle_per_corner
muscle_fee = 0.5            # corner-days to recruit a head
claim_cost = 1.0            # corner-days to set up on a free corner
supplier_min = 0.75         # its supplier price as a fraction of street, drawn between these:
supplier_max = 0.95         # a better connect than yours (0.55 is what you pay) is what lets it undercut
push_flip = 0.4             # chance a push flips a corner at even odds; scales by attack/(attack+defence)
push_war = 8                # war heat per push
undercut_price = 0.03       # street price drag per day when every corner you work is undercut by the best connect (scales by the share that is); against reversion it settles prices ~10% lower
tip_heat = 6                # heat a tip to the police adds
observe_days = 8            # days after arrival before its personality shows; a push or a tip shows it sooner
regroup_days = 20           # days after losing its last corner before it tries again
war_decay = 0.10            # fraction of war heat that fades per day
war_threshold = 40          # past this the war is open: headlines, and the police notice
crackdown_threshold = 80    # past this the police clear the front line on both sides
crackdown_corners = 2       # corners each side loses in a crackdown, contested ones first
crackdown_heat = 12         # heat the player draws from a crackdown
crackdown_muscle = 0.5      # fraction of the rival's muscle a crackdown takes
outbid_grudge = 1           # grudge it holds when a claim it telegraphed finds somebody on the corner (#69: the tell)

# Pace (#60): how fast it takes the city. Its claim chance is scaled by
# your share of home's corners, from claim_scale_min with nothing held to
# claim_scale_max with all of it (a player with nothing gets time, one
# with eight corners gets a fight); after any claim it waits
# claim_cooldown days before it claims again, unless your enforcers have
# been in within those days (a fight is a fight: struck, it grows as
# fast as it can), and its arrival is not a claim, so the second corner
# comes as soon as it likes (the roll is still made on a cooldown day,
# so the seed's dice do not move); and for arrive_grace days after it
# arrives it never sets up on a corner you have ever worked. While it
# waits it pushes on your corners at push_past_cap, as it does once it
# holds its share: the pace is slower, never a pause. Fear slows its
# claims too (reputation.toml rival_claim_cut).
[pace]
claim_scale_min = 0.25
claim_scale_max = 1.5
claim_cooldown = 12
arrive_grace = 5

# The price war (#68): the player's third answer to a rival corner, money.
# Working a corner next to one of the rival's cheap takes a share of its
# demand: steal of the rival corner's demand at the normal dial, scaled by
# the dial's impact and by the worked share of its neighbours you hold
# (two of your corners bordering it cut deeper than one; all of them cut
# the full share), served on top of your own corners' demand by tonight's
# orders at price_cut off the street price, and with glut on those units'
# price impact, so a long price war crashes the product you fight it
# with. The rival corner's squeeze carries the share taken that day, so
# its income there falls without it knowing who did it. Each undercut day
# adds war to the war, and no public pressure: it is business, not
# violence. A corner squeezed pricewar_days days (a rest that long
# forgets them) gets an answer by personality, and, if grudge, a grudge
# held with it (so tip_chance applies; a grudge every undercut day made
# the price war hotter than a hit war): a defensive or expansionist rival
# pushes on the player corner doing the cutting at push_chance times
# pricewar_push, an opportunist abandons the corner (RivalAbandoned) and
# claims elsewhere, a chaotic one rolls between the two.
[pricewar]
steal = 0.20
price_cut = 0.10
glut = 1.4
war = 2
grudge = true
pricewar_days = 5
pricewar_push = 2.0

# Diplomacy (#32): the table. A proposal is answered the next morning with
# a chance built from the deal kind's base, the terms asked (the easy
# option adds `terms`, the hard one takes it away), accept_trust at full
# trust, the personality's deal_bias, accept_war at a full-loud war, and
# what the player's reputation adds (reputation.toml [effects]). After a
# betrayal the rival takes nothing for distrust_days and trust sits at
# betrayal_floor. Every day of a live deal earns trust_kept.
[diplomacy]
offer_days = 5              # a rival offer stays on the table this long
trust_kept = 0.6            # trust per day of a live deal (respect adds to it: reputation.toml)
accept_trust = 0.5          # added to the chance at trust 100
accept_war = 0.35           # added to the chance at war 100: a loud war makes peace attractive to both sides
betrayal_floor = 5          # trust after you break a deal
distrust_days = 30          # days after a betrayal it takes no deal and offers none
betrayal_spread = 20        # trust every other faction loses when you betray one (Phase 4 wires it)
joint_trust = 70            # trust a joint shipment needs (#30 wires it)
truce_days = [15, 30, 60]   # the three lengths a truce can be proposed at: the short one is the easy ask
tribute_cuts = [0.05, 0.10, 0.20] # the three cuts of your daily street value in what the rival sells (rivals.Sim.TributeBase, #162) a tribute can be: the big one is the easy ask
tribute_min = 200           # a tribute is never under this a day
low_cash_days = 3           # an expansionist that cannot pay its muscle this many days offers a truce
upper_hand = 1.5            # an opportunist with this many times the guard on your front line demands tribute
split_fair = 0.45           # share of the city's demand it lets your side of a split have at trust 0 ...
split_trust = 0.30          # ... plus this at trust 100; a greedier line is refused outright
split_terms = 4             # the split's terms (-1..1) are its slack, the fair line less your ask, times this:
                            # a quarter of the city under the line is the easiest ask there is

# What each deal kind is worth to it before trust and temper.
[deal.truce]
base = 0.20
terms = 0.15
[deal.tribute]
base = 0.35
terms = 0.20
[deal.split]
base = 0.10
terms = 0.15

# Personalities. trust is where its trust in you starts; deal_bias is
# added to the chance it accepts any proposal; betrayal is the chance per
# live deal per day it breaks one itself; offer_chance is per day its
# situation calls for a deal. claim_chance and push_chance are per day; max_share is
# the most of home's corners it sets up on, as a share of the map (0.6 of
# ten corners is six), and past it it pushes on your corners at
# push_past_cap times the chance (0: only with a grudge); grow says where
# it claims (biggest free
# corner anywhere, one next to its own, or at random); muscle_per_corner is how
# much muscle it keeps per corner held (plus one); undercut is the share of
# a contested corner's demand it steals; tip_chance is per day with a
# grudge; defence multiplies its muscle when you strike it.
[personality.expansionist]
trust = 35
deal_bias = -0.15           # it wants the city; a truce is a pause, and it offers one only when it cannot pay its muscle
betrayal = 0
offer_chance = 0.25
claim_chance = 0.25
max_share = 0.6
push_past_cap = 0.5         # it wants the city, and slows down once it has most of it
grow = "biggest"
push_chance = 0.15
muscle_per_corner = 1.0
undercut = 0.15
tip_chance = 0.30
defence = 1.0

[personality.defensive]
trust = 55
deal_bias = 0.20            # it would rather hold what it has; it offers a truce once the war is loud, and never breaks one
betrayal = 0
offer_chance = 0.30
claim_chance = 0.08
max_share = 0.3
grow = "adjacent"
push_chance = 0.03
muscle_per_corner = 2.0
undercut = 0.10
tip_chance = 0.50
defence = 1.6

[personality.opportunist]
trust = 40
deal_bias = 0
betrayal = 0
offer_chance = 0.20         # it demands tribute while it has the upper hand on the front line
claim_chance = 0.15
max_share = 0.4
grow = "biggest"
push_chance = 0.08          # doubled on a corner with no enforcer, or while your heat is over 50
muscle_per_corner = 1.0
undercut = 0.25
tip_chance = 0.60
defence = 0.9

[personality.chaotic]
trust = 45
deal_bias = 0.05
betrayal = 0.02             # per deal-day: it breaks deals for no reason
offer_chance = 0.10         # a truce now and then, on a whim
claim_chance = 0.20
max_share = 0.4
grow = "random"
push_chance = 0.15
muscle_per_corner = 1.2
undercut = 0.20
tip_chance = 0.40
defence = 1.0

# The weight of bodies on the street (#275: the numbers rivals.Sim
# Strength and Guard had in the code). Going in, each of your enforcers
# at work counts strength_base plus skill over strength_skill, and one
# posted on a corner of yours counts that over posted: he is busy. Held,
# a corner of yours pushed by a faction weighs guard_enforcer plus skill
# over guard_skill for the enforcer on it, guard_you where you work it
# yourself, guard_runner where a runner does, plus the tree's guard_bonus.
[weight]
strength_base = 0.5
strength_skill = 100        # a skill-100 enforcer brings one and a half of a skill-0 one's weight ...
posted = 2                  # ... and half of it from a corner he guards
guard_enforcer = 1
guard_skill = 50            # an enforcer standing on the corner is worth one to three bodies by skill ...
guard_you = 1.5             # ... you, one and a half: they know who you are ...
guard_runner = 0.5          # ... and a runner, half of one: he runs

# The force dial on a strike. attack multiplies your enforcers' strength;
# flip is the chance to take the corner at even odds; heat is what the
# player draws (times the corner's heat); war is what it adds to the war;
# loyalty is what an enforcer with no nerve loses over it; trust is what
# it costs the rival's trust in you (a push or a hit under a live deal is
# a betrayal on top of that; a warning is not).
[force.warn]
attack = 0.4
flip = 0.25
heat = 3
war = 5
loyalty = 1
trust = 2

[force.push]
attack = 1.0
flip = 0.6
heat = 8
war = 12
loyalty = 3
trust = 6

[force.hit]
attack = 1.8
flip = 0.9
heat = 18
war = 25
loyalty = 6
trust = 12

# The books (#70): the player's fourth answer to the rival, beside the
# enforcers, the table and the price war. The rival is a machine with a
# weak point: its muscle is what the take pays for and its chest is what
# a hire or a claim needs (#139), so a drain is felt. Four moves, each a
# decision with a price. Scouting buys a snapshot of its books (Known:
# cash, income, muscle, the wage bill, and the day they were read) at
# scout_cost, with the odds of crew.toml's investigation (base, plus
# scout_skill at the best enforcer's skill 100, plus scout_learn per
# empty night since the last read); the snapshot goes stale after
# stale_days and the panel says how old it is. A failed scout costs the
# money and reads nothing. The scout roll comes off the books side stream
# (Tick.Sub("books")), so a run that never scouts is the old run.
[books]
scout_cost = 2000
scout_base = 0.25
scout_skill = 0.6
scout_learn = 0.2
stale_days = 10

# Boosting (#70): the enforcers go in on a rival corner for the day's
# takings, not the ground. One strike order a night, so a boost is sent
# where a strike is, at a force, with the strike's odds (rivals.Sim.Odds:
# the picker shows one number and the dice use it) and the roll the strike
# makes; it never flips the corner. A boost that lands takes take of the
# corner's day of takings (the till: the street value it moved today, a
# price war's squeeze off, which is its income over margin) off the
# rival's chest and into your dirty cash (at half the margin a boost
# took $530 and the chest grew regardless); it draws heat (times the corner's heat) and adds war, both
# between warn's and push's, and costs the enforcers loyalty (the toll,
# by nerve, as a strike's). One that fails costs fail_loss instead and,
# against a rival with more than fail_muscle heads, one enforcer is hurt
# (fail_hurt skill, the one with the least nerve). A boost at push or hit
# under a live deal is a betrayal as a strike is; at warn it is not. It
# is fear, not respect (reputation.toml [fear] boost), and it holds no
# grudge: the war and the force's trust are its price at the table (a
# grudge a landed boost brought the saboteur 24 calls in 65 days, a hit
# war's noise).
[boost]
take = 1.0
heat = 3
war = 6
loyalty = 2
fail_loss = 4
fail_muscle = 4
fail_hurt = 5

# Tipping the police on a rival corner (#70): free in cash, expensive in
# everything else. Rival.Heat (0..100) rises by heat per tip, and while
# it is over zero by push_heat per push the rival makes (a rival already
# under police attention draws more with every push; at zero its own
# violence draws none, so a run that never tips is the old run), and
# fades by decay of itself a day. Over police_notice the police take the
# corner last tipped (RivalRaided: the corner to the street, raid_muscle
# of its muscle gone, its heat down by police_notice), the mirror of the
# rival's own calls, and not twice within raid_days: a tip a night is a
# corner every raid_days, not a rival routed in a month for nothing (a
# tipster with no cooldown had every rival at zero corners by day 30 on
# five seeds). A raid is not a rout: the police take a corner, not a
# faction, so a rival raided off its last corner is not sent to regroup
# and sets up again at its own pace. A tip costs trust off Rival.Trust, a raid adds grudge to
# its grudge (a grudge a tip made an expansionist push at full pace past
# its cap); under a truce or a tribute a tip is a betrayal (the truce
# binds the rival to no tips, so it binds you); and heat.toml's
# tip_evidence is the chance the DA's file gains a page anyway: talking
# to the police is talking to the police. A raid is news on a home block:
# law.toml [pressure] rival_raid.
[tip]
heat = 15
push_heat = 5
decay = 0.05
police_notice = 60
raid_muscle = 0.25
raid_days = 15
trust = 8
grudge = 1

# The table (#43): a run has min to max factions by seed, at most one of
# them chaotic. The first is the rival at home on the dice it always
# rolled (min = max = 1 is the duel, byte-for-byte the run before #43);
# the rest arrive arrive_gap days apart (the second arrive_gap days
# after arrive_day: every faction on day 10 broke three money bands),
# live at home unless away says otherwise (the chance a seat lives in
# the other city, at most away_max of them; 0 by ruling: a faction in
# the hub took the boss's road), and roll on their own streams. With
# shared_pace the factions on the ground in a city claim and push on
# you at the duel's pace between them (each at its chance over their
# number), and the table holds at most table_share of a city's corners
# between them before it stops claiming free ones and pushes on you at
# push_past_cap: past it factions grow only off each other or off you,
# so the ground the duel left you is the ground the table leaves. They
# contest each other's bordering corners at the push odds, muscle
# against muscle; a push draws push_heat on the city (0: at 2 a quiet
# trader was indicted on other people's war) and law.toml's factions
# pressure; a faction that took a corner off another is held a grudge
# (grudge_trust off the loser's trust in it, a grudge that makes it push
# back harder); and a defensive faction sides with whoever the
# expansionist in its city is pushing on: ally_trust per push, and at
# ally_line ally_share of its front-line muscle joins their pushes on it
# (yours too). A faction with no corners for absorb_days since another
# took its last is absorbed by it (its muscle joins them); routed by you
# or the police it regroups as it always did. The richest faction with
# poach_cash corner-days in the chest offers your least loyal member
# poach_mul their wages at poach_chance a night: under poach_line they
# go, over it they stay a little less loyal (poach_dip). Its heat past
# leader_arrest_heat (your tips, #70) costs it its leader: it fragments,
# its corners drift to the street over fragment_days in random order,
# its city's products spike shock_mul for shock_days and its muscle turn
# up in your hiring pool at fragment_discount of the fee; the
# rival_leader_killed incident (#44) fragments the biggest faction in
# its city the same way. A faction your enforcers have taken
# tribute_corners off offers homage, homage_cut of its take a day, at
# homage_chance a night; Dominant() is every faction arrived and
# absorbed, fragmented or paying it. Poaching and homage need a table:
# with one faction in the run nobody poaches and nobody bows, so the
# duel stays the duel.
[factions]
min = 3
max = 6
away = 0
away_max = 1
arrive_gap = 25
shared_pace = true
table_share = 0.6
absorb_days = 30
ally_trust = 3
ally_line = 70
ally_share = 0.5
grudge_trust = 6
push_heat = 0
poach_cash = 30
poach_mul = 1.5
poach_chance = 0.10
poach_line = 25
poach_dip = 4
leader_arrest_heat = 90
fragment_days = 10
shock_mul = 1.3
shock_days = 5
fragment_discount = 0.5
tribute_corners = 3
homage_cut = 0.20
homage_chance = 0.25

# The table follows the money (#341, rivals.Sim.expand): the rivals sim
# keeps your take in each city away from home over the last window_days
# days (off PlayerSold, no dice), and a city where no faction lives
# whose window crosses take_min draws one, telegraphed in stages: the
# scouts (a seat still in the wings, or a cell of the strongest faction
# at home once every seat has arrived), the recruiting scout_days later
# (bite of the hiring pool's best faces, your crew in the city poachable
# at the table's poach_chance and poach_line, and a tribute offered for
# a peace), and the arrival arrive_days after that, under arrive_grace
# like any arrival. A hit on the scouts sets it back setback_days, once;
# a window back under take_min before the recruiting sends the scouts
# home. A run whose take away from home never crosses take_min never
# sees it. It needs a table: the duel never expands. enabled = false
# boxes it (harness.NoExpansion).
[expansion]
enabled = true
take_min = 500000
window_days = 7
scout_days = 7
arrive_days = 7
setback_days = 7
bite = 2

# The endings this sim owns (#49, docs/endings.md), each a threshold on
# state the step already reads and no dice: kingpin once Dominant() has
# held dominant_days days (the day the last faction fell or bowed is on
# the table's stamps, so no counter) with more than kingpin_share of
# home's corners held (the weather, #44's rival_leader_killed, empties a
# table over a quiet trader on one corner in a year on a seed in six,
# and a city nobody holds has no kingpin); taken out the night a faction's
# push takes the last corner you hold anywhere with its war open
# (war_threshold) and fewer enforcers at work than taken_out_muscle;
# betrayed the night a faction breaks a deal with you of its own accord
# (a chaotic one's whim) while another faction's war with you is over
# betray_war. Zero boxes each; the harness's NoEndings boxes all three.
# The war order (#229, World.DeclareWar, rivals.Sim.WarTarget): enforcers
# as a standing order against one faction. Every night the hand sends no
# strike, the rivals sim sends the hand's strike at this dial on the
# faction's corner nearest your front line, with the same roll, heat,
# loyalty toll, fear and notoriety, so the war is exactly the strikes the
# hand would have sent; it ends the night the faction is gone, pays
# homage or holds no corner in a city you hold. A dial that is not warn,
# push or hit boxes it (harness.NoWar).
[war]
dial = "hit"

[endings]
dominant_days = 14
kingpin_share = 0.5
taken_out_muscle = 2
betray_war = 40

# Buying off muscle (#70): dirty cash to send the rival's people home.
# They leave the rival and never join you. A head costs muscle_price
# corner-days plus cash_share of the rival's chest per head it keeps (a
# well-paid crew costs more), cut by your respect (reputation.toml
# [effects] poach_price_cut). One order a night, resolved by the rivals
# sim off the books side stream: at odds it lands, the heads walk
# (never more than the rival has; what you paid for men who were not
# there comes back) and the rival never finds out; failing, the money is
# gone and it holds a grudge (grudge). A head sent home is out of the
# pool the rival hires from (Rival.Away: it wants that many fewer), and
# so is one a raid put in the van; they come back one every away_days
# days. Without it a head bought off was hired back in the morning out
# of the day's take, and a saboteur bought 58 on one seed for nothing.
[poach]
muscle_price = 3.0
cash_share = 0.5
odds = 0.7
grudge = 1
away_days = 5
